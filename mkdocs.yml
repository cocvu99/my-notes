site_name: My Interview & Study Notes

theme:
  name: material
  custom_dir: src

  features:
    - content.code.copy
    - content.code.select
    - content.code.annotate

  palette:
    scheme: slate
    primary: indigo
    accent: indigo

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true

  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
    custom_fences:
      - name: mermaid
        class: mermaid
        format: !!python/name:pymdownx.superfences.fence_code_format

  - pymdownx.arithmatex:
      generic: true
  - sane_lists
  - tables

plugins:
  - search
  - awesome-pages 

extra_javascript:
  - javascripts/config.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
