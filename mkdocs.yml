site_name: My Interview & Study Notes

theme:
  name: material
  custom_dir: src

  features:
    - content.code.copy
    - content.code.select
    - content.code.annotate

  palette:
    scheme: slate
    primary: indigo
    accent: indigo

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true

  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

  - pymdownx.arithmatex:
      generic: true
  - sane_lists

plugins:
  - search
  - awesome-pages 

nav:
  - Trang chủ: index.md
  - Algorithms: algorithms_and_data_structures/
  - CS Fundamentals: computer_science_fundamentals/ 
  - Interviews: interviews/

extra_javascript:
  - javascripts/config.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
