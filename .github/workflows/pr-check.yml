name: PR Check - MkDocs Build

on:
  pull_request:
    branches:
      - main

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install mkdocs-material dependencies
        run: |
          chmod +x scripts/install-mkdocs.sh
          scripts/install-mkdocs.sh

      - name: Validate MkDocs Build (Strict Mode)
        # This step will fail if warning nav or deadlink
        run: mkdocs build --strict