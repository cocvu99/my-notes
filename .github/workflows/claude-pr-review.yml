name: Claude Auto Review

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize]

permissions: {}

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository

    runs-on: ubuntu-latest
    timeout-minutes: 15         

    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1       

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Please review this pull request with a focus on:
            - Code quality and best practices
            - Potential bugs or issues
            - Security implications
            - Performance considerations

            Note: The PR branch is already checked out in the current working
            directory. Read files directly instead of running shell commands:
            you do NOT have permission to run arbitrary Bash, and attempts will
            be denied. Do not try to build or lint the project.

            You must always post something, even when the PR looks fine.

            To post top-level feedback, first write the review body to a file,
            then run exactly this command with no pipes and no $(...) :
              gh pr comment ${{ github.event.pull_request.number }} --body-file <path>

            Use `mcp__github_inline_comment__create_inline_comment`
            (with `confirmed: true`) to highlight specific code issues.

            Only post GitHub comments - don't submit review text as messages.

          claude_args: |
            --max-turns 25
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

      - name: Ensure a review was posted
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          issue_comments=$(gh api "repos/$REPO/issues/$PR/comments" \
            --jq '[.[] | select(.user.login == "claude[bot]")] | length')
          review_comments=$(gh api "repos/$REPO/pulls/$PR/comments" \
            --jq '[.[] | select(.user.login == "claude[bot]")] | length')
          echo "claude[bot] comments -> issue: $issue_comments, review: $review_comments"
          if [ "$issue_comments" -eq 0 ] && [ "$review_comments" -eq 0 ]; then
            echo "::error::Claude finished but posted no review on this PR."
            exit 1
          fi
