name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install mkdocs mkdocs-material

      - name: Build MkDocs
        run: mkdocs build

# Best Practice: State Check & Provision (Idempotency)
      - name: Ensure Cloudflare Pages Project Exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Checking target state on Cloudflare..."
          
          # Query API to get project's lists. If project found, skip. If not, then creating new.
          if npx wrangler pages project list | grep -q "my-private-docs"; then
            echo "State matches: Project 'my-private-docs' already exists. Skipping creation."
          else
            echo "State mismatch: Project missing. Provisioning now..."
            npx wrangler pages project create my-private-docs --production-branch main
          fi

      - name: Deploy to Cloudflare Pages via Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name="my-private-docs" --commit-dirty=true